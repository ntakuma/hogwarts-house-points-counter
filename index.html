<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts House Points Counter</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(20, 25, 38, 0.6);
            --border-color: rgba(212, 175, 55, 0.15);
            --gold: #d4af37;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
            
            --gryffindor: #d42e2e;
            --gryffindor-glow: rgba(212, 46, 46, 0.4);
            --hufflepuff: #f59e0b;
            --hufflepuff-glow: rgba(245, 158, 11, 0.4);
            --ravenclaw: #3b82f6;
            --ravenclaw-glow: rgba(59, 130, 246, 0.4);
            --slytherin: #10b981;
            --slytherin-glow: rgba(16, 185, 129, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta+Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(212, 46, 46, 0.03) 0%, transparent 40%);
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 6px;
            text-shadow: 0 2px 20px rgba(212, 175, 55, 0.2);
        }

        header p {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Houses Container - Inline & Minimalist */
        .houses-container {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 24px;
            width: 100%;
            max-width: 1300px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .house-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 24px;
            width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .house-card:hover {
            transform: translateY(-6px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        /* Leader Badge */
        .leader-badge {
            position: absolute;
            top: -14px;
            background: linear-gradient(135deg, #f3e7c4, #d4af37);
            color: #07090e;
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 3px;
            padding: 5px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            opacity: 0;
            transform: scale(0.7) translateY(5px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 5;
        }

        .house-card.is-leader .leader-badge {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* House Name */
        .house-name {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
            text-align: center;
        }

        .gryffindor-title { color: #f87171; }
        .hufflepuff-title { color: #fbbf24; }
        .ravenclaw-title { color: #60a5fa; }
        .slytherin-title { color: #34d399; }

        /* Taller Hourglass */
        .hourglass {
            width: 80px;
            height: 240px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .hourglass-glass-shine {
            position: absolute;
            top: 0;
            right: 12px;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.15), transparent);
            pointer-events: none;
            z-index: 4;
        }

        .hourglass-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
